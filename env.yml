name: 21cmfast
channels:
  - conda-forge
dependencies:
  # ── Interpreter ──────────────────────────────────────────────────────────
  - python=3.11

  # ── 21cmFAST C build dependencies ────────────────────────────────────────
  # Must come from conda-forge and be present *before* 21cmFAST is pip
  # installed; the build links against them and otherwise fails with
  # "cannot find -lfftw3f".  See docs/INSTALL_21cmFASTv4.md.
  - fftw
  - gsl

  # ── Scientific stack ─────────────────────────────────────────────────────
  - numpy>=2.0
  - scipy>=1.14
  - astropy>=7.0
  - matplotlib>=3.9
  - h5py>=3.11

  # ── Notebook support ─────────────────────────────────────────────────────
  - ipykernel
  - jupyter

  # ── pip-only packages ────────────────────────────────────────────────────
  - pip
  - pip:
      # Compiles C extensions at install time, so it must be installed after
      # fftw/gsl are available in the environment.
      - 21cmFAST==4.1.1
      # Halo mass function code (Murray, Robotham & Power 2013), used for the
      # Euclid-selected galaxy bias estimate.
      - hmf>=3.5
